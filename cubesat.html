.iso{

  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(720px,100% - 32px);margin:64px auto 96px}

.iso[data-theme="light"]{--cs-cell:#c3c6cd;--cs-night:#e4e4e1;--cs-void:#8f9096}
.cs-cell{fill:var(--cs-cell);stroke:none}
.cs-night{fill:var(--cs-night);stroke:none}
.cs-void{fill:var(--cs-void);stroke:none}
.cs-eclipse{stroke-width:1.5px}
.cs-tape{stroke-width:1.05px}
.cs-needle{stroke-width:1.1px}
.cs-svg [data-on]>.iso-line,.cs-svg [data-on] .iso-solid>.iso-edge{stroke:var(--anatomy-lit);transition:stroke .3s}
.cs-svg [data-on] .iso-solid>.iso-top{fill:var(--anatomy-lit-top)}
.cs-svg [data-on] .iso-solid>.iso-shade{fill:var(--anatomy-lit-shade)}
.cs-svg [data-on]>.iso-dots{fill:var(--anatomy-lit)}
.cs-svg [data-lamp][data-on] .iso-top{fill:var(--anatomy-hi)}
.cs-svg [data-lamp][data-on] .iso-edge{stroke:var(--anatomy-hi)}
.cs-stage{cursor:pointer;outline:none;border-radius:inherit}
.cs-stage:focus-visible{box-shadow:inset 0 0 0 1px var(--anatomy-mid)}
.cs-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cs-steps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 16px 16px}
.cs-steps button{font:11px/1.2 var(--anatomy-mono);letter-spacing:.03em;color:var(--anatomy-muted);background:transparent;border:1px solid var(--anatomy-faint);border-radius:999px;padding:5px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.cs-steps button span{color:var(--anatomy-lo)}
.cs-steps button:hover{color:var(--anatomy-text);border-color:var(--anatomy-lo)}
.cs-steps button[aria-pressed="true"]{color:var(--anatomy-strong);border-color:var(--anatomy-mid)}
.cs-steps button[aria-pressed="true"] span{color:var(--anatomy-mid)}

@media (max-width:480px){.cs-stage{overflow:hidden}.cs-svg{width:116%;margin-left:-8%}}
.cs-stage{position:relative}
.cs-callouts{position:absolute;inset:0;pointer-events:none}
.cs-callout{position:absolute;box-sizing:border-box;padding:7px 10px 8px;border:1px solid var(--anatomy-lo);border-radius:6px;background:color-mix(in srgb,var(--anatomy-card) 88%,transparent);color:var(--anatomy-text);font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;opacity:0;transform:translateY(4px);transition:opacity .45s var(--anatomy-ease),transform .45s var(--anatomy-ease)}
.cs-callout b{display:block;color:var(--anatomy-strong);font-weight:600;margin-bottom:1px}
.cs-callout.on{opacity:1;transform:none}
.cs-leader{opacity:0;transition:opacity .45s var(--anatomy-ease)}
.cs-leader.on{opacity:1}
.cs-leader path{fill:none;stroke:var(--anatomy-mid);stroke-width:.6px}
.cs-leader circle{fill:var(--anatomy-hi);stroke:var(--anatomy-card);stroke-width:.5px}
@media (prefers-reduced-motion:reduce){.cs-callout,.cs-leader{transition:none}}
@media (max-width:560px){
  .cs-callouts{position:static;padding:0 16px 10px;min-height:76px}
  .cs-callout{position:static;width:auto!important;display:none;transform:none}
  .cs-callout.on{display:block}
  .cs-leaders{display:none}
}

.1 291.4ZM295.5 292.2L295.2 291.8L295.2 290.8L295.5 291.2ZM295.2 291.8L295.1 291.4L295.1 290.4L295.2 290.8Z"/><path class="iso-top" d="M362.1 298.3L362.7 298.5L363 298.9L363.1 299.3L362.8 299.7L352.5 307.9L352 308.2L351.3 308.3L350.5 308.3L349.7 308.2L296.1 291.4L295.5 291.2L295.2 290.8L295.1 290.4L295.4 290L305.7 281.8L306.2 281.5L306.9 281.4L307.7 281.4L308.5 281.5Z"/><path class="iso-line iso-crease" data-tone="faint" d="M363.1 299.3L362.8 299.7L352.5 307.9L352 308.2L351.3 308.3L350.5 308.3L349.7 308.2L296.1 291.4L295.5 291.2L295.2 290.8L295.1 290.4"/><path class="iso-line iso-edge" data-tone="mid" d="M295.1 290.4L295.4 290L305.7 281.8L306.2 281.5L306.9 281.4L307.7 281.4L308.5 281.5L362.1 298.3L362.7 298.5L363 298.9L363.1 299.3M363.1 300.3L362.8 300.7L352.5 308.9L352 309.2L351.3 309.3L350.5 309.4L349.7 309.2L296.1 292.5L295.5 292.2L295.2 291.8L295.1 291.4M363.1 299.3L363.1 300.3M295.1 290.4L295.1 291.4"/></g><path class="iso-line" data-tone="faint" d="M360.6 299.2L350.7 307.1L297.6 290.5L307.5 282.6Z"/><path class="iso-line" data-tone="lo" data-free="" d="M307.8 285.6L347.6 298"/><path class="iso-line" data-tone="lo" data-free="" d="M305.2 287.7L337.5 297.8"/><path class="iso-line" data-tone="lo" data-free="" d="M302.6 289.8L322.4 296"/><g class="iso-dots" data-tone="mid"><circle cx="357.3" cy="299.4" r="0.45"/><circle cx="349.6" cy="305.6" r="0.45"/></g><g data-part="needle"></g><g data-part="orbit-dot"></g><g data-part="pointer"></g><g class="cs-leaders"><g class="cs-leader" data-leader="0"><path d=""/><circle r="1.3"/></g><g class="cs-leader" data-leader="1"><path d=""/><circle r="1.3"/></g><g class="cs-leader" data-leader="2"><path d=""/><circle r="1.3"/></g><g class="cs-leader" data-leader="3"><path d=""/><circle r="1.3"/></g><g class="cs-leader" data-leader="4"><path d=""/><circle r="1.3"/></g></g></svg><div class="cs-callouts" aria-hidden="true"><div class="cs-callout" data-callout="0" lang="ru"><b>Пружина деплоера</b>Сжата за толкателем; выключатели на рельсах прижаты — питания нет.</div><div class="cs-callout" data-callout="1" lang="ru"><b>Концевой выключатель</b>Выйдя из деплоера на 1,6 м/с, спутник отпускает его: питание замыкается, стартует бортовой компьютер.</div><div class="cs-callout" data-callout="2" lang="ru"><b>Ленточные антенны УКВ, 4 × 17 см</b>Раскрываются через 30 мин после отделения, когда пережигается удерживающая нить.</div><div class="cs-callout" data-callout="3" lang="ru"><b>Солнечные панели, 16 элементов</b>На 31-й минуте поворачиваются на 90° и дают 16,8 Вт на солнце.</div><div class="cs-callout" data-callout="4" lang="ru"><b>Батарея 46 Вт·ч, 4 × 18650</b>В тени Земли (до 35,8 из 94,6 мин) держит нагрузку 4,2 Вт, на солнце заряжается.</div></div><span class="cs-sr" role="status" aria-live="polite" data-status></span></div><div class="cs-steps" role="group" aria-label="Mission stage"><button type="button" data-step="0" aria-pressed="true"><span>01</span>Stowed</button><button type="button" data-step="1" aria-pressed="false"><span>02</span>Ejected</button><button type="button" data-step="2" aria-pressed="false"><span>03</span>Antennas</button><button type="button" data-step="3" aria-pressed="false"><span>04</span>Wings</button><button type="button" data-step="4" aria-pressed="false"><span>05</span>Orbit</button></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>What changes at this stage: the spring, a switch, the antennas, the wings, the battery needle</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Satellite: rails, panels, battery, power, computer and radio boards, reaction wheels</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Bench: deployer on its stand, battery gauge (80 to 100 %), orbit dial at true scale, stage lamps</span></span><span class="iso-caption">A 3U CubeSat is three 10 cm cubes stacked to 34.05 cm, at most 6 kg, built around four corner rails that slide in a standard deployer. Stowed, the spring is compressed and the deployment switches on the rails are held in, so nothing has power. The door opens, the spring pushes the satellite out at about 1.6 m/s, the switches spring out and the computer boots. The rules say wait: nothing may unfold for 30 minutes and the radio stays silent for 45. Then a burn wire cuts the line holding four 17 cm tape antennas, and the two wings swing open to put 16 solar cells, 16.8 W, toward the sun. At 500 km an orbit takes 94.6 minutes and up to 35.8 of them are in Earth's shadow, so the 46 Wh battery (four 18650 cells) carries the 4.2 W load through every eclipse and recharges in sunlight. The reaction wheels spin to hold the wings toward the sun.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    top: buckets[4].join(""),

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function prismOf(F, polygon, s0, s1, P) {

  const path3 = (points, closed = false) => k.pathOf(points.map(at), closed);
  const S = (paths, style) => k.solidSvg(paths, style);
  const L = (d, style) => k.lineSvg(d, style);
  const rect = (u0, u1, v0, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];
  const W3 = (F, s, x, y) => [0, 1, 2].map((i) => F.o[i] + F.a[i] * s + F.u[i] * x + F.v[i] * y);

  function wingFrame(which, theta) {
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    const [hy, hz] = D.wing[which];
    const u = which === "top" ? [0, c, s] : [0, c, -s];
    const v = which === "top" ? [0, -s, c] : [0, s, c];
    return { o: [0, hy, hz], a: [1, 0, 0], u, v };
  }

  // A deployable wing: a 1.2-thick substrate on its hinge line, with eight cells on each face.
  function wing(which, theta) {

    const F = wingFrame(which, theta);
    const body = S(G.prismOf(F, rect(u0, u1, -t / 2, t / 2), s0, s1, P), { tone: "hi" });
    const up = G.dot3(F.v, V) > 0 ? t / 2 : -t / 2;
    const gap = 0.8;
    const cellL = (s1 - s0 - 2.4 - gap * 3) / 4;
    const cellW = (u1 - u0 - 1.6 - 0.6) / 2;
    let fill = "";
    let edge = "";
    let fingers = "";
    let bars = "";
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 2; j++) {
        const a = s0 + 1.2 + i * (cellL + gap);
        const b = a + cellL;
        const c = u0 + 0.8 + j * (cellW + 0.6);
        const d = c + cellW;
        const quad = path3([W3(F, a, c, up), W3(F, b, c, up), W3(F, b, d, up), W3(F, a, d, up)], true);

        edge += quad;
        const bus = j === 0 ? c + 1.3 : d - 1.3;
        bars += path3([W3(F, a, bus, up), W3(F, b, bus, up)]);
        for (let f = 1; f < 9; f++) {

          fingers += path3([W3(F, sf, c, up), W3(F, sf, d, up)]);

  // The main spring from the end plate to the back of the pusher plate.
  function spring(p) {
    const { from, z, r, turns } = D.spring;
    const c = k.coil(from, p - D.pusher.t, [0, z], r, turns, "x", P, 20);

  function antennas(share) {

    let lines = "";
    const tips = [];
    for (const { root, dir } of D.antennas) {

      lines += path3([root, tip]);
      tips.push(at(tip));
    }
    return L(lines, { tone: "hi", className: "cs-tape" }) + k.dotsSvg(tips, { size: 0.55, tone: "hi" });
  }

  // Spin marks on the three reaction wheels: balance holes and one index line from hub to rim.
  function wheelMarks(angle, which) {
    let lines = "";
    const dots = [];
    for (const { F, s, hub, rim, sign } of [D.wheels[which]]) {
      const a = angle * sign;
      lines += path3([G.pointOf(F, s, hub, a), G.pointOf(F, s, rim, a)]);
      for (let i = 1; i < 6; i++) dots.push(at(G.pointOf(F, s, (hub + rim) / 2 + 0.6, a + (i * TAU) / 6)));

    return L(lines, { tone: "hi" }) + k.dotsSvg(dots, { size: 0.42, tone: "lo" });
  }

  // Battery gauge: 80 to 100 % over 300 degrees, zero at the left.
  function needle(soc) {
    const { c: [x, y], r, z, from, span } = D.gauge;
    const share = Math.min(1, Math.max(0, (soc - 0.8) / 0.2));
    const angle = from + share * span;
    const sx = Math.sin(angle);
    const sy = -Math.cos(angle);
    return k.lineOnTop([x - sx * 2.6, y - sy * 2.6], [x + sx * (r - 3.2), y + sy * (r - 3.2)], z + 0.2, P);

  // The satellite's place on the orbit dial; the sun is toward −x on the dial.
  function orbitDot(phaseDeg) {
    const { c: [x, y], orbit, z } = D.orbitDial;
    const a = (phaseDeg * Math.PI) / 180;
    return at([x - orbit * Math.cos(a), y + orbit * Math.sin(a), z + 0.1]);
  }

  // Stage knob pointer: five detents from −60° to +60°.
  function pointer(stage) {
    const { c: [x, y], z, r } = D.knob;
    const angle = ((-60 + stage * 30) * Math.PI) / 180;
    return k.lineOnTop([x, y], [x + Math.sin(angle) * r, y - Math.cos(angle) * r], z, P);
  }

  // Deployment switch plunger on the near bottom rail: held flush in the deployer, 1.4 out when free.
  function plunger(share) {
    const { x, z, y0, out } = D.plunger;
    return S(G.disc(y0, y0 + 0.1 + out * share, 0.75, G.frameOf([x, 0, z], [0, 1, 0], [0, 0, 1], [1, 0, 0]), P), { tone: "hi" });
  }

  return { wing, door, spring, antennas, wheelMarks, needle, orbitDot, pointer, plunger };
}

}
new ResizeObserver(() => placeCallout(shownCallout)).observe(stage$);

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring) {
    tourClock += dt;
    if (tourClock > TOUR[s.stage]) {
      tourClock = 0;
      setStage((s.stage + 1) % 5, false);
    }
  }
  const st = s.stage;
  const doorT = st >= 1 ? 1 : s.e < 0.3 ? 0 : 1;
  const eT = st >= 1 ? (s.door > 0.985 ? EJECT : 0) : s.ant < 0.01 && s.wing < 0.01 ? 0 : s.e;
  const antT = st >= 2 ? (s.e > EJECT - 3 ? 1 : 0) : s.wing < 0.01 ? 0 : s.ant;
  const wingT = st >= 3 && s.ant > 0.98 ? 1 : 0;
  s.door = follow(s.door, doorT, dt, 0.16, calm);
  s.e = follow(s.e, eT, dt, 0.3, calm);
  s.sw = follow(s.sw, s.e > SWITCH_AT ? 1 : 0, dt, 0.05, calm);
  s.ant = follow(s.ant, antT, dt, 0.2, calm);
  s.wing = follow(s.wing, wingT, dt, 0.32, calm);
  s.knob = follow(s.knob, st, dt, 0.12, calm);
  for (const key of ["door", "sw", "ant", "wing"]) if (near(s[key], Math.round(s[key]), 6e-4)) s[key] = Math.round(s[key]);
  if (near(s.e, eT, 0.02)) s.e = eT;
  if (near(s.knob, st, 0.002)) s.knob = st;
  const running = st >= 4 && s.wing > 0.99;
  if (running) {
    s.t += dt * MINUTES_PER_SECOND;
    if (!calm) s.spin = (s.spin + dt * 2.2) % (Math.PI * 2);
  }
  const t = missionTime();
  const socT = t === null ? DATA.soc.values[0] : socAt(t);
  s.soc = follow(s.soc, socT, dt, 0.18, calm);
  if (near(s.soc, socT, 1e-5)) s.soc = socT;
  draw();
  const settled = !touring && !running && s.door === doorT && s.e === eT && s.ant === antT && s.wing === wingT && s.knob === st && s.soc === socT;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

function setStage(next, byUser) {
  const prev = s.stage;
  s.stage = Math.max(0, Math.min(4, next));
  if (s.stage === 4 && prev !== 4) s.t = DATA.timeline.radio;
  buttons.forEach((b, i) => b.setAttribute("aria-pressed", String(i === s.stage)));
  status.textContent = `Stage ${s.stage + 1} of 5: ${NAMES[s.stage]}`;
  if (byUser) {
    touring = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      touring = !still.matches;
      tourClock = 0;
      run();
    }, 9000);
  }
  run();
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage$);

stage$.addEventListener("click", () => setStage((s.stage + 1) % 5, true));
buttons.forEach((b, i) => b.addEventListener("click", () => setStage(i, true)));
stage$.addEventListener("keydown", (event) => {
  let to = null;
  if (event.key === "ArrowRight" || event.key === "ArrowUp" || event.key === " " || event.key === "Enter") to = Math.min(4, s.stage + 1);
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = Math.max(0, s.stage - 1);
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = 4;
  if (/^[1-5]$/.test(event.key)) to = Number(event.key) - 1;
  if (to === null) return;
  event.preventDefault();
  setStage(to, true);
});
still.addEventListener?.("change", () => {
  touring = !still.matches;
  run();
});
window.__cubesat = { setStage: (n) => setStage(n, true), state: s };
draw();
</script></body></html>
