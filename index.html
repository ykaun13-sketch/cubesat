<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сборщик CubeSat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Russo+One&display=swap">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#14213D; --muted:#586983; --line:#CBD4E1;
  --frame:#1D4E89; --frameSoft:#DCE6F3; --accent:#C58A12; --accentInk:#865A00;
  --ok:#2B8A3E; --okBg:#E6F4EA; --warn:#A8640A; --warnBg:#FDF1DC; --err:#C92A2A; --errBg:#FCE8E8;
  --cell:#2A4A8C; --cell2:#3E63B0; --earth:#2F7FBF; --earthLand:#4E9F5B;
  --g-ctrl:#3B5BDB; --g-pwr:#D9480F; --g-com:#0C8599; --g-adcs:#6741D9; --g-pl:#C2255C; --g-out:#5C677D;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1626; --surface:#122238; --surface2:#0F1D30; --ink:#E6EDF7; --muted:#95A6C0; --line:#28405F;
    --frame:#7FB2F0; --frameSoft:#16304F; --accent:#E2B04A; --accentInk:#E9BE63;
    --ok:#69DB7C; --okBg:#133322; --warn:#F2B84B; --warnBg:#3A2A0E; --err:#FF8787; --errBg:#3D1718;
    --cell:#2F56A3; --cell2:#4A74C9; --earth:#2A6FA8; --earthLand:#3F8A4C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1626; --surface:#122238; --surface2:#0F1D30; --ink:#E6EDF7; --muted:#95A6C0; --line:#28405F;
  --frame:#7FB2F0; --frameSoft:#16304F; --accent:#E2B04A; --accentInk:#E9BE63;
  --ok:#69DB7C; --okBg:#133322; --warn:#F2B84B; --warnBg:#3A2A0E; --err:#FF8787; --errBg:#3D1718;
  --cell:#2F56A3; --cell2:#4A74C9; --earth:#2A6FA8; --earthLand:#3F8A4C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:20px 16px;border-bottom:1px solid var(--line)}
.brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
.brand h1 span{color:var(--accentInk)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;min-height:42px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--frame);color:var(--surface)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;max-width:100%}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;font-weight:600}
.mission{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;color:var(--muted)}
.mission b{color:var(--ink)}

.grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.15fr) minmax(280px,1fr);gap:20px;margin-top:20px;align-items:start}
@media (max-width:1040px){.grid{grid-template-columns:1fr 1fr}.col-model{grid-column:1 / -1;order:-1}}
@media (max-width:680px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 12px;letter-spacing:.01em}
.group{margin-top:14px}
.group:first-of-type{margin-top:0}
.group h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;width:100%}
.item:hover{border-color:var(--frame)}
.item .nm{font-weight:600}
.item .sp{font-family:var(--mono);font-size:12px;color:var(--muted);grid-column:1}
.item .ds{font-size:13px;color:var(--muted);grid-column:1 / -1}
.item .ad{grid-row:1 / span 2;grid-column:2;align-self:center;font-weight:600;font-size:13px;border-radius:999px;padding:4px 10px;background:var(--frameSoft);color:var(--frame);white-space:nowrap}
.item[aria-pressed="true"]{border-color:var(--frame);background:var(--frameSoft)}
.item[aria-pressed="true"] .ad{background:var(--frame);color:var(--surface)}
.item.example .nm::after{content:"усл.";font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accentInk);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}

.col-model .panel{display:flex;flex-direction:column;gap:14px}
.stage{display:flex;justify-content:center;background:radial-gradient(ellipse at 50% 30%,var(--frameSoft),transparent 70%);border-radius:10px}
.stage svg{width:100%;max-width:440px;height:auto;max-height:72vh;display:block}
.meters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.meter{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2)}
.meter .lb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.meter .vl{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;margin-top:2px}
.meter .vl small{font-size:12px;color:var(--muted);font-weight:400}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .3s}
.meter.warn .bar i{background:var(--warn)} .meter.err .bar i{background:var(--err)}
.meter.err .vl{color:var(--err)}
.stack{display:flex;flex-direction:column;gap:4px}
.stack h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 0 4px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 6px 5px 10px;background:var(--surface2)}
.row .nm{flex:1;min-width:0;font-weight:500;font-size:14px}
.row .sp{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.row button{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:34px;height:34px;display:grid;place-items:center;font-size:14px;flex:none}
.row button:disabled{opacity:.35;cursor:default}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.orbitnote{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

.goal,.chk{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;padding:9px 10px;border-radius:9px;align-items:start}
.goals,.checks{display:flex;flex-direction:column;gap:6px}
.chk.err{background:var(--errBg)} .chk.warn{background:var(--warnBg)} .chk.ok{background:transparent;padding-block:5px}
.ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--surface)}
.err .ic{background:var(--err)} .warn .ic{background:var(--warn)} .ok .ic{background:var(--ok)}
.goal .ic{background:transparent;border:2px solid var(--line);color:var(--ok)}
.goal.done .ic{border-color:var(--ok)}
.chk .tt,.goal .tt{font-weight:600}
.chk.ok .tt{font-weight:500}
.chk .tx{grid-column:2;font-size:13.5px;color:var(--ink)}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap}
.sec{margin-top:16px}
.sec:first-child{margin-top:0}
.sec>h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.dock .in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.status{flex:1;min-width:180px;font-weight:600}
.status .n{font-family:var(--mono)}
.status.err{color:var(--err)} .status.warn{color:var(--warn)} .status.ok{color:var(--ok)}
.launch{border:0;border-radius:12px;background:var(--accent);color:#1B1300;font-family:var(--display);font-size:17px;padding:12px 22px;min-height:48px}
.launch:hover{filter:brightness(1.07)}

.overlay{position:fixed;inset:0;background:rgba(6,14,26,.72);display:grid;place-items:center;padding:16px;z-index:10}
.card{background:var(--surface);border-radius:16px;max-width:520px;width:100%;padding:22px;border:1px solid var(--line);max-height:90vh;overflow:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 8px}
.card p{margin:0 0 10px}
.card .kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin:12px 0;font-family:var(--mono)}
.card .kv span:nth-child(odd){font-family:var(--body);color:var(--muted)}
.flight{height:140px;border-radius:12px;background:linear-gradient(#08101E,#0E2240);position:relative;overflow:hidden;margin-bottom:14px}
.flight .earth{position:absolute;left:-10%;right:-10%;bottom:-260px;height:320px;border-radius:50%;background:radial-gradient(circle at 50% 20%,#4AA0E0,#1D5E9A 60%);box-shadow:0 0 30px #4AA0E088}
.flight .sat{position:absolute;top:34px;left:-40px;width:34px;height:14px;animation:fly 5s linear infinite}
.flight .sat::before{content:"";position:absolute;left:11px;top:-2px;width:12px;height:18px;background:#C9CFD8;border-radius:2px}
.flight .sat::after{content:"";position:absolute;inset:4px 0;background:linear-gradient(90deg,#3E63B0 0 10px,transparent 10px 24px,#3E63B0 24px)}
.flight .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7}
@keyframes fly{from{transform:translateX(0)}to{transform:translateX(620px)}}
@media (prefers-reduced-motion:reduce){.flight .sat{animation:none;left:45%}.bar i{transition:none}}
.qrbox{text-align:center}
.qrbox img{width:min(320px,80vw);height:auto;image-rendering:pixelated;background:#fff;padding:10px;border-radius:10px}
.flash{animation:flash .9s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--err)}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>Школа МКА · Космическая мастерская</small>
      <h1>Сборщик <span>CubeSat</span></h1>
    </div>
    <div class="controls">
      <div class="field">
        <label for="mission">Миссия</label>
        <select id="mission"></select>
      </div>
      <div class="field">
        <label>Формат</label>
        <div class="seg" id="useg" role="group" aria-label="Формат спутника"></div>
      </div>
      <button class="ghost" id="reset" type="button">Очистить</button>
      <button class="ghost" id="qrbtn" type="button" hidden>QR для класса</button>
    </div>
  </header>
  <div class="mission" id="missionText"></div>

  <div class="grid">
    <section class="col-cat">
      <div class="panel">
        <h2>Бортовые системы</h2>
        <div id="catalog"></div>
      </div>
    </section>

    <section class="col-model">
      <div class="panel">
        <div class="stage" id="stage"></div>
        <div class="meters" id="meters"></div>
        <div class="stack" id="stack"></div>
        <div class="orbitnote">Условия полёта: круговая орбита 500 км, виток ≈ 95 мин, из них ≈ 35 мин в тени Земли. Сеансы связи: ≈ 4 пролёта над станцией в сутки по 8 мин. Все параметры упрощены для занятия.</div>
      </div>
    </section>

    <section class="col-chk">
      <div class="panel" id="checkPanel">
        <div class="sec" id="goalsSec">
          <h3>Задачи миссии</h3>
          <div class="goals" id="goals"></div>
        </div>
        <div class="sec">
          <h3>Проверка инженеров</h3>
          <div class="checks" id="checks"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="dock">
  <div class="in">
    <div class="status" id="status"></div>
    <button class="launch" id="launch" type="button">Запуск</button>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true"></div>
</div>

<script>
(function(){
const QR_SRC = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPgAAAD4AQAAAADpqhamAAABfUlEQVR4nOWZsY7DMAxDySL//8vvBkl2e0M3W2ncAk1hDqFhhpQUo6+f13f453HV/kFC5MJY7ea3Gr9yr5YkI8kYjdVufhv2L38euseFfn47cVuKB6Hn/jfATR1/z/2345dK9xYWlqxpAO389vn/v2+udvNbjZu3vyZUoLnYzW89HopP0VsIkMsG+vmtx40ghRD+5zTC5+e/y/ykkj8zAWjnt0f/TsurK6o6oJ/fWjy3Smw3LjCbgW5+6/Ufeq/TzwJoBEA3v/X1D5V7qgcfWekCjz//l6LmI6r/sn3hKINuwG8x7qF9YVwFUdaA/fzW4pfIjj9UUPZvYfAB+o/Jh40sG33YwA34rcVz5JM/YYUpB+Tn+99bv0cF/3QAHr//2f+Z4QPhAPiA/Luq0RsdULhfGMHz82/Ofyv6qRjwCfPPOf/Ngs9WPgRH5P/Ea/5RFiD7gPy7xr+SQL7/yCK4m98OnEi87IPCCCw4wf/e5r/z/V/OANBJ+d9z/278D9WSzaywc2ITAAAAAElFTkSuQmCC";   // заполняется при публикации

const U = {
  1:{usable:90,  maxMass:2000, struct:100, len:113.5},
  2:{usable:190, maxMass:4000, struct:170, len:227},
  3:{usable:290, maxMass:6000, struct:250, len:340.5}
};
const SHADOW_H = 35/60, CONTACT_S = 4*8*60, VIDEO_BYTES = 25e6, DOD = 0.3;

const GROUPS = {
  ctrl:{t:"Управление", c:"--g-ctrl"},
  pwr:{t:"Электропитание", c:"--g-pwr"},
  com:{t:"Связь", c:"--g-com"},
  adcs:{t:"Ориентация", c:"--g-adcs"},
  pl:{t:"Полезная нагрузка", c:"--g-pl"},
  out:{t:"Снаружи корпуса", c:"--g-out"}
};
const P = [
  {id:"obc", g:"ctrl", name:"Бортовой компьютер", short:"БКУ", h:15, m:60, p:0.4, ds:"Выполняет программу полёта, хранит данные и командует остальными системами."},
  {id:"eps", g:"pwr", name:"Система электропитания", short:"СЭП", h:15, m:90, p:0.15, ds:"Принимает энергию от солнечных панелей, заряжает АКБ, раздаёт питание."},
  {id:"bat10", g:"pwr", name:"Аккумулятор 10 Вт·ч", short:"АКБ 10", h:20, m:110, p:0, cap:10, ds:"Питает спутник, пока он летит в тени Земли."},
  {id:"bat20", g:"pwr", name:"Аккумулятор 20 Вт·ч", short:"АКБ 20", h:30, m:210, p:0, cap:20, ds:"Ёмкость вдвое больше, но тяжелее и выше."},
  {id:"uhf", g:"com", name:"Радио УКВ 435 МГц", short:"УКВ", h:15, m:75, p:0.5, band:"uhf", rate:9600, ds:"Команды и телеметрия. Надёжно, но медленно: 9600 бит/с."},
  {id:"sband", g:"com", name:"Передатчик S-диапазона 2,4 ГГц", short:"S-диап.", h:15, m:90, p:1.5, band:"s", rate:1e6, ds:"Быстрый канал для снимков и видео: 1 Мбит/с."},
  {id:"mag", g:"adcs", name:"Магнитная ориентация", short:"Магн.", h:15, m:80, p:0.4, adcs:1, ds:"Магнитометр и катушки. Гасят вращение, точность около ±10°."},
  {id:"rw", g:"adcs", name:"Маховики", short:"Маховики", h:30, m:250, p:1.2, adcs:2, ds:"Точно наводят спутник, около ±1°. Нужны для съёмки."},
  {id:"pad", g:"pl", name:"ПН PAD, видеомодуль", short:"PAD", h:40, m:180, p:3.0, cam:true, video:true, ex:true, ds:"Снимает и обрабатывает видео. Объектив должен смотреть на Землю."},
  {id:"sprite", g:"pl", name:"ПН SPRITE", short:"SPRITE", h:35, m:150, p:1.0, ex:true, ds:"Вторая полезная нагрузка проекта МКА."},
  {id:"cam", g:"pl", name:"Камера ДЗЗ", short:"Камера", h:35, m:140, p:1.5, cam:true, ds:"Фотографирует поверхность Земли."},
  {id:"ant_uhf", g:"out", ext:true, name:"Антенна УКВ", m:30, band:"uhf", ds:"Рулеточные штыри, раскрываются после отделения."},
  {id:"ant_s", g:"out", ext:true, name:"Патч-антенна S", m:25, band:"s", ds:"Плоская антенна на торце для S-передатчика."},
  {id:"sp_body", g:"out", ext:true, name:"Панели на корпусе", mU:50, genU:1.4, ds:"Солнечные элементы на гранях. ≈ 1,4 Вт на 1U в среднем за виток."},
  {id:"sp_dep", g:"out", ext:true, name:"Раскрывающиеся панели", mU:150, genU:2.6, ds:"Две створки на шарнирах. ≈ 2,6 Вт на 1U, но нужен механизм раскрытия."}
];
const byId = Object.fromEntries(P.map(p=>[p.id,p]));

const MISSIONS = {
  free:{t:"Свободная сборка", u:3, text:"Соберите любой спутник, который пройдёт проверку инженеров.", goals:()=>[]},
  first:{t:"«Первый голос»", u:1, text:"Самый маленький спутник 1U должен выйти на связь и передавать телеметрию на Землю.",
    goals:s=>[{t:"Формат 1U", ok:s.u===1},{t:"Телеметрия идёт по УКВ", ok:s.has("uhf")&&s.hasExt("ant_uhf")}]},
  video:{t:"«Видео с орбиты»", u:3, text:"Спутник снимает видео модулем PAD. Одна минута видео (≈ 25 МБ) должна дойти до Земли за сутки.",
    goals:s=>[{t:"На борту PAD", ok:s.has("pad")},{t:"Точная ориентация для съёмки", ok:s.adcs>=2},{t:"Минута видео доходит за сутки", ok:s.videoDays!==null&&s.videoDays<=1}]},
  double:{t:"«Двойная миссия»", u:3, text:"В одном корпусе летят обе нагрузки проекта: PAD и SPRITE. Хватит ли места и энергии?",
    goals:s=>[{t:"На борту PAD", ok:s.has("pad")},{t:"На борту SPRITE", ok:s.has("sprite")},{t:"Минута видео доходит за сутки", ok:s.videoDays!==null&&s.videoDays<=1}]}
};

const EXAMPLE = {mission:"video", u:3, stack:["obc","eps","bat20","pad","uhf"], ext:["ant_uhf","sp_body"]};
let st = JSON.parse(JSON.stringify(EXAMPLE));

const $ = id=>document.getElementById(id);
const nf = (v,d=0)=>v.toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
const col = g=>`var(${GROUPS[g].c})`;
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* ---------- расчёт ---------- */
function calc(){
  const cfg = U[st.u];
  const items = st.stack.map(id=>byId[id]);
  const ext = st.ext.map(id=>byId[id]);
  const s = {u:st.u, cfg};
  s.has = id=>st.stack.includes(id);
  s.hasExt = id=>st.ext.includes(id);
  s.height = items.reduce((a,p)=>a+p.h,0);
  s.mass = cfg.struct + items.reduce((a,p)=>a+p.m,0) + ext.reduce((a,p)=>a+(p.m||0)+(p.mU?p.mU*st.u:0),0);
  s.cons = items.reduce((a,p)=>a+p.p,0);
  s.gen = ext.reduce((a,p)=>a+(p.genU?p.genU*st.u:0),0);
  s.cap = items.reduce((a,p)=>a+(p.cap||0),0);
  s.need = s.cons*SHADOW_H;
  s.adcs = Math.max(0,...items.map(p=>p.adcs||0));
  const links = items.filter(p=>p.band && s.hasExt(p.band==="uhf"?"ant_uhf":"ant_s"));
  s.rate = Math.max(0,...links.map(p=>p.rate));
  s.videoDays = s.has("pad") ? (s.rate ? VIDEO_BYTES/(CONTACT_S*s.rate/8) : null) : null;
  return s;
}

function checks(s){
  const L = [];
  const add=(lvl,tt,tx,tag)=>L.push({lvl,tt,tx,tag});
  const need=(id,okT,errT,tag)=> s.has(id)?add("ok",okT,"",tag):add("err",errT[0],errT[1],tag);
  need("obc","Бортовой компьютер на месте",["Нет бортового компьютера","Без него спутник не выполнит ни одной команды."],"тема 9");
  need("eps","Система электропитания на месте",["Нет системы электропитания","Энергию от панелей некому распределять."],"тема 10");
  if(s.cap>0) add("ok","Аккумулятор на месте","","тема 10"); else add("err","Нет аккумулятора","В тени Земли спутник останется без питания и выключится.","тема 10");

  const radios = st.stack.map(id=>byId[id]).filter(p=>p.band);
  if(!radios.length) add("err","Нет радио","Спутник не сможет получать команды и передавать данные.","тема 3");
  radios.forEach(r=>{
    const ant = r.band==="uhf"?"ant_uhf":"ant_s";
    if(s.hasExt(ant)) add("ok",`${r.short}: антенна подключена`,"","тема 3");
    else add("err",`${r.name} без антенны`,`Добавьте «${byId[ant].name}». Без антенны радио не слышно.`,"тема 3");
  });
  if(!s.hasExt("sp_body")&&!s.hasExt("sp_dep")) add("err","Нет солнечных панелей","Аккумулятор разрядится за один виток, и зарядить его будет нечем.","тема 10");

  const pl = st.stack.filter(id=>byId[id].g==="pl");
  if(!pl.length && st.mission!=="first") add("warn","Нет полезной нагрузки","Спутник полетит, но не выполнит никакой полезной работы.","тема 5");

  // объём
  if(s.height>s.cfg.usable) add("err","Модули не помещаются",`Стопка ${nf(s.height)} мм, а внутри ${st.u}U помещается ${s.cfg.usable} мм. Уберите модуль или возьмите корпус больше.`,"тема 9");
  else add("ok",`Модули помещаются: ${nf(s.height)} из ${s.cfg.usable} мм`,"","тема 9");
  // масса
  if(s.mass>s.cfg.maxMass) add("err","Перевес",`Масса ${nf(s.mass/1000,2)} кг, а стандарт CubeSat разрешает для ${st.u}U не больше ${nf(s.cfg.maxMass/1000)} кг.`,"тема 9");
  else if(s.mass>s.cfg.maxMass*0.9) add("warn","Масса почти на пределе",`${nf(s.mass/1000,2)} из ${nf(s.cfg.maxMass/1000)} кг. Запаса почти нет.`,"тема 9");
  else add("ok",`Масса в норме: ${nf(s.mass/1000,2)} кг`,"","тема 9");
  // энергия
  if(s.gen>0 && s.cons>0){
    const margin = (s.gen-s.cons)/s.cons;
    if(s.gen<s.cons) add("err","Энергии не хватает",`Панели дают ${nf(s.gen,1)} Вт, а системы потребляют ${nf(s.cons,1)} Вт. Аккумулятор будет разряжаться с каждым витком.`,"тема 10");
    else if(margin<0.2) add("warn","Энергия впритык",`Запас всего ${nf(margin*100)}%. Инженеры закладывают хотя бы 20%: панели стареют, а спутник не всегда повёрнут к Солнцу.`,"тема 10");
    else add("ok",`Энергобаланс: ${nf(s.gen,1)} Вт ≥ ${nf(s.cons,1)} Вт`,"","тема 10");
  }
  if(s.cap>0){
    if(s.need>s.cap*DOD) add("err","Аккумулятор не переживёт тень",`За 35 мин тени нужно ${nf(s.need,1)} Вт·ч, а разряжать АКБ можно только на 30%: это ${nf(s.cap*DOD,1)} Вт·ч.`,"тема 10");
    else add("ok",`Тень: нужно ${nf(s.need,1)} из ${nf(s.cap*DOD,1)} Вт·ч`,"","тема 10");
  }
  // ориентация
  if(s.adcs===0) add("warn","Спутник будет кувыркаться","Без системы ориентации спутник медленно вращается. Для связи это терпимо, для съёмки нет.","тема 4");
  // камеры
  st.stack.forEach((id,i)=>{
    const p = byId[id];
    if(!p.cam) return;
    if(i!==st.stack.length-1) add("err",`${p.short}: объектив закрыт`,"Камера должна стоять в самом низу стопки, у торца, который смотрит на Землю.","тема 5");
    if(id==="pad" && s.adcs<2) add("err","PAD: видео будет смазано","Для видео нужна точная ориентация. Поставьте маховики.","тема 8");
    if(id==="cam" && s.adcs<2) add("warn","Камера: снимки будут нечёткими","С магнитной ориентацией спутник наводится с точностью ±10°. Для резких кадров нужны маховики.","тема 7");
  });
  const cams = st.stack.filter(id=>byId[id].cam);
  if(cams.length>1) add("warn","Две камеры в одной стопке","Смотреть на Землю может только нижний модуль.","тема 5");
  // данные
  if(s.has("pad")){
    if(s.videoDays===null) add("err","Видео не передать","Нет работающей радиолинии с антенной.","тема 3");
    else if(s.videoDays>1) add("warn","Видео идёт слишком долго",`По УКВ за сутки уходит ≈ ${nf(CONTACT_S*s.rate/8/1e6,1)} МБ. Минута видео (25 МБ) будет передаваться ≈ ${nf(s.videoDays)} сут. Нужен S-диапазон.`,"тема 3");
    else add("ok",`Минута видео передаётся за ≈ ${nf(VIDEO_BYTES*8/s.rate/60,1)} мин связи`,"","тема 8");
  }
  if(s.hasExt("sp_dep")) add("ok","Раскрывающиеся панели: нужен механизм раскрытия","","темы 11–12");
  const order={err:0,warn:1,ok:2};
  return L.sort((a,b)=>order[a.lvl]-order[b.lvl]);
}

/* ---------- отрисовка ---------- */
function renderControls(){
  $("mission").innerHTML = Object.entries(MISSIONS).map(([k,m])=>`<option value="${k}"${k===st.mission?" selected":""}>${m.t}</option>`).join("");
  $("useg").innerHTML = [1,2,3].map(u=>`<button type="button" data-u="${u}" aria-pressed="${u===st.u}">${u}U</button>`).join("");
  const m = MISSIONS[st.mission];
  $("missionText").innerHTML = `<b>${m.t}.</b> <span>${m.text}</span>`;
}

function renderCatalog(){
  const html = Object.entries(GROUPS).map(([g,G])=>{
    const its = P.filter(p=>p.g===g).map(p=>{
      const on = p.ext? st.ext.includes(p.id) : st.stack.includes(p.id);
      let sp;
      if(p.ext){ sp = p.mU? `${p.mU} г/U · +${nf(p.genU,1)} Вт/U` : `${p.m} г`; }
      else { sp = `${p.h} мм · ${p.m} г · ${p.p?nf(p.p,2).replace(/,?0+$/,"")+" Вт":p.cap+" Вт·ч"}`; }
      return `<button type="button" class="item${p.ex?" example":""}" data-id="${p.id}" aria-pressed="${on}">
        <span class="nm">${esc(p.name)}</span><span class="ad">${on?"✓ на борту":"+ добавить"}</span>
        <span class="sp">${sp}</span><span class="ds">${esc(p.ds)}</span></button>`;
    }).join("");
    return `<div class="group"><h3><span class="dot" style="background:${col(g)}"></span>${G.t}</h3><div class="items">${its}</div></div>`;
  }).join("");
  $("catalog").innerHTML = html + `<p class="empty" style="margin:12px 0 0">Метка «усл.»: параметры PAD и SPRITE условные, для занятия.</p>`;
}

function renderStage(s){
  const k = 1.5, cfg = s.cfg;
  const fw = 100*k, fh = cfg.len*k, rail = 8.5*k;
  const W = 440, x0 = (W-fw)/2, y0 = 56;
  const H = y0 + Math.max(fh, (10+s.height)*k+10) + 80;
  let g = "";
  // Земля
  g += `<path d="M -20 ${H} Q ${W/2} ${H-70} ${W+20} ${H} Z" fill="var(--earth)" opacity=".85"/>`;
  g += `<path d="M 60 ${H} Q 110 ${H-38} 170 ${H-30} Q 200 ${H-26} 215 ${H}" fill="var(--earthLand)" opacity=".8"/>`;
  g += `<text x="${W/2}" y="${H-14}" text-anchor="middle" font-size="12" fill="#fff" font-family="var(--body)" font-weight="600">Земля</text>`;
  // раскрывающиеся панели
  if(s.hasExt("sp_dep")){
    [[x0-8-fw*0.95, x0-8],[x0+fw+8, x0+fw+8+fw*0.95]].forEach(([a,b],i)=>{
      g += `<rect x="${a}" y="${y0}" width="${b-a}" height="${fh}" rx="3" fill="url(#cells)" stroke="var(--frame)" stroke-width="1.5"/>`;
      g += `<circle cx="${i?a-4:b+4}" cy="${y0+fh-6}" r="4" fill="var(--accent)" stroke="var(--frame)"/>`;
    });
  }
  // УКВ антенны
  if(s.hasExt("ant_uhf")){
    g += `<line x1="${x0+4}" y1="${y0+4}" x2="${x0-60}" y2="${y0-44}" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/>`;
    g += `<line x1="${x0+fw-4}" y1="${y0+4}" x2="${x0+fw+60}" y2="${y0-44}" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  if(s.hasExt("ant_s")) g += `<rect x="${x0+fw/2-22}" y="${y0-9}" width="44" height="9" rx="2" fill="var(--accent)" stroke="var(--frame)"/>`;
  // корпус
  g += `<rect x="${x0}" y="${y0}" width="${fw}" height="${fh}" rx="4" fill="var(--surface)" stroke="var(--frame)" stroke-width="2"/>`;
  if(s.hasExt("sp_body")){
    g += `<rect x="${x0}" y="${y0}" width="${rail}" height="${fh}" fill="url(#cells)"/><rect x="${x0+fw-rail}" y="${y0}" width="${rail}" height="${fh}" fill="url(#cells)"/>`;
  } else {
    g += `<rect x="${x0}" y="${y0}" width="${rail}" height="${fh}" fill="var(--frameSoft)" stroke="var(--frame)"/><rect x="${x0+fw-rail}" y="${y0}" width="${rail}" height="${fh}" fill="var(--frameSoft)" stroke="var(--frame)"/>`;
  }
  for(let i=1;i<st.u;i++){
    const y = y0 + i*113.5*k;
    g += `<line x1="${x0}" y1="${y}" x2="${x0+fw}" y2="${y}" stroke="var(--frame)" stroke-dasharray="4 4" opacity=".6"/>`;
  }
  for(let i=0;i<st.u;i++) g += `<text x="${x0+fw+10}" y="${y0+i*113.5*k+16}" font-size="11" fill="var(--muted)" font-family="var(--mono)">${i+1}U</text>`;
  // модули
  let y = y0 + 10*k;
  const limitY = y0 + (10+cfg.usable)*k;
  const ix = x0+rail+3, iw = fw-2*rail-6;
  st.stack.forEach((id,i)=>{
    const p = byId[id], h = p.h*k, over = y+h>limitY;
    g += `<rect x="${ix}" y="${y+1}" width="${iw}" height="${h-2}" rx="3" fill="${col(p.g)}" ${over?'stroke="var(--err)" stroke-width="2.5" stroke-dasharray="5 3"':''}/>`;
    g += `<text x="${ix+iw/2}" y="${y+h/2+4}" text-anchor="middle" font-size="${h<24?10:12}" fill="#fff" font-family="var(--body)" font-weight="600">${esc(p.short)}</text>`;
    if(p.cam){
      const bottom = i===st.stack.length-1;
      const ly = bottom? Math.max(y+h, y0+fh) : y+h/2;
      if(bottom) g += `<path d="M ${x0+fw/2-16} ${y0+fh} a 16 10 0 0 0 32 0 Z" fill="#1B1F2A" stroke="var(--accent)" stroke-width="2"/>
        <path d="M ${x0+fw/2-26} ${y0+fh+14} L ${x0+fw/2-60} ${H-60} M ${x0+fw/2+26} ${y0+fh+14} L ${x0+fw/2+60} ${H-60}" stroke="var(--accent)" stroke-dasharray="3 4" stroke-width="1.5"/>`;
    }
    y += h;
  });
  if(s.height>cfg.usable) g += `<line x1="${x0-6}" y1="${limitY}" x2="${x0+fw+6}" y2="${limitY}" stroke="var(--err)" stroke-width="2"/><text x="${x0-10}" y="${limitY+4}" text-anchor="end" font-size="11" fill="var(--err)" font-weight="600" font-family="var(--body)">предел</text>`;
  if(!st.stack.length) g += `<text x="${W/2}" y="${y0+fh/2}" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="var(--body)">Добавьте модули</text>`;
  const defs = `<defs><pattern id="cells" width="12" height="14" patternUnits="userSpaceOnUse"><rect width="12" height="14" fill="var(--cell)"/><rect x="1" y="1" width="10" height="12" fill="var(--cell2)"/></pattern></defs>`;
  $("stage").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Схема спутника ${st.u}U">${defs}${g}</svg>`;
}

function renderMeters(s){
  const m = (lb,val,unit,frac,lvl)=>`<div class="meter ${lvl}"><div class="lb">${lb}</div><div class="vl">${val} <small>${unit}</small></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,frac*100))}%"></i></div></div>`;
  const massL = s.mass>s.cfg.maxMass?"err":s.mass>s.cfg.maxMass*.9?"warn":"";
  const hL = s.height>s.cfg.usable?"err":"";
  const eL = s.gen<s.cons?"err":(s.gen-s.cons)/Math.max(s.cons,.01)<.2?"warn":"";
  const bL = s.need>s.cap*DOD?"err":"";
  $("meters").innerHTML =
    m("Масса", nf(s.mass/1000,2), `из ${nf(s.cfg.maxMass/1000)} кг`, s.mass/s.cfg.maxMass, massL) +
    m("Объём", nf(s.height), `из ${s.cfg.usable} мм`, s.height/s.cfg.usable, hL) +
    m("Энергия", `${nf(s.cons,1)} / ${nf(s.gen,1)}`, "Вт расход / приход", s.gen? s.cons/s.gen : (s.cons?1:0), eL) +
    m("Тень, АКБ", `${nf(s.need,1)} / ${nf(s.cap*DOD,1)}`, "Вт·ч нужно / есть", s.cap? s.need/(s.cap*DOD) : (s.need?1:0), bL);
}

function renderStack(){
  const rows = st.stack.map((id,i)=>{
    const p = byId[id];
    return `<div class="row"><span class="dot" style="background:${col(p.g)}"></span><span class="nm">${esc(p.name)}</span><span class="sp">${p.h} мм</span>
      <button type="button" data-act="up" data-i="${i}" aria-label="Выше" ${i===0?"disabled":""}>▲</button>
      <button type="button" data-act="down" data-i="${i}" aria-label="Ниже" ${i===st.stack.length-1?"disabled":""}>▼</button>
      <button type="button" data-act="del" data-i="${i}" aria-label="Убрать">✕</button></div>`;
  }).join("");
  const ext = st.ext.map(id=>`<div class="row"><span class="dot" style="background:${col("out")}"></span><span class="nm">${esc(byId[id].name)}</span><button type="button" data-act="delx" data-id="${id}" aria-label="Убрать">✕</button></div>`).join("");
  $("stack").innerHTML = `<h3>Стопка сверху вниз (низ смотрит на Землю)</h3>${rows||'<div class="empty">Пока пусто. Нажмите на модуль в списке.</div>'}${ext?`<h3>Снаружи</h3>${ext}`:""}`;
}

let last = {s:null,L:[],goals:[]};
function renderChecks(s){
  const L = checks(s), goals = MISSIONS[st.mission].goals(s);
  $("goalsSec").hidden = !goals.length;
  $("goals").innerHTML = goals.map(g=>`<div class="goal${g.ok?" done":""}"><span class="ic">${g.ok?"✓":""}</span><span class="tt">${g.t}</span></div>`).join("");
  const icon = {err:"!",warn:"?",ok:"✓"};
  $("checks").innerHTML = L.map(c=>`<div class="chk ${c.lvl}"><span class="ic">${icon[c.lvl]}</span><span class="tt">${esc(c.tt)}<span class="tag">${c.tag}</span></span>${c.tx?`<span class="tx">${esc(c.tx)}</span>`:""}</div>`).join("");
  const nE = L.filter(c=>c.lvl==="err").length, nW = L.filter(c=>c.lvl==="warn").length, nG = goals.filter(g=>!g.ok).length;
  const el = $("status");
  if(nE){ el.className="status err"; el.innerHTML=`Ошибок: <span class="n">${nE}</span>${nW?` · предупреждений: <span class="n">${nW}</span>`:""}`; }
  else if(nG){ el.className="status warn"; el.innerHTML=`Ошибок нет. Не выполнено задач миссии: <span class="n">${nG}</span>`; }
  else if(nW){ el.className="status warn"; el.innerHTML=`Можно запускать. Предупреждений: <span class="n">${nW}</span>`; }
  else { el.className="status ok"; el.textContent="Спутник готов к запуску"; }
  last = {s,L,goals,nE,nG};
}

function render(){
  const s = calc();
  renderControls(); renderCatalog(); renderStage(s); renderMeters(s); renderStack(); renderChecks(s);
}

/* ---------- действия ---------- */
document.addEventListener("click",e=>{
  const it = e.target.closest(".item");
  if(it){
    const p = byId[it.dataset.id];
    const arr = p.ext? st.ext : st.stack;
    const i = arr.indexOf(p.id);
    if(i>=0) arr.splice(i,1);
    else if(p.cam) arr.push(p.id);           // камеры ставим вниз
    else { const ci = st.stack.findIndex(id=>byId[id].cam); ci>=0 && !p.ext ? arr.splice(ci,0,p.id) : arr.push(p.id); }
    render(); return;
  }
  const b = e.target.closest("[data-act]");
  if(b){
    const i = +b.dataset.i, a = b.dataset.act;
    if(a==="up"&&i>0) [st.stack[i-1],st.stack[i]]=[st.stack[i],st.stack[i-1]];
    if(a==="down"&&i<st.stack.length-1) [st.stack[i+1],st.stack[i]]=[st.stack[i],st.stack[i+1]];
    if(a==="del") st.stack.splice(i,1);
    if(a==="delx") st.ext = st.ext.filter(x=>x!==b.dataset.id);
    render(); return;
  }
  const ub = e.target.closest("[data-u]");
  if(ub){ st.u = +ub.dataset.u; render(); }
});
$("mission").addEventListener("change",e=>{ st.mission = e.target.value; st.u = MISSIONS[st.mission].u; render(); });
$("reset").addEventListener("click",()=>{ st.stack=[]; st.ext=[]; render(); });

function openCard(html){ $("card").innerHTML = html; $("overlay").hidden = false; const b=$("card").querySelector("button"); b&&b.focus(); }
function closeCard(){ $("overlay").hidden = true; }
$("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay"||e.target.closest("[data-close]")) closeCard(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeCard(); });

$("launch").addEventListener("click",()=>{
  const {s,L,goals,nE,nG} = last;
  if(nE || nG){
    const errs = L.filter(c=>c.lvl==="err").map(c=>`<li>${esc(c.tt)}</li>`).join("");
    const gl = goals.filter(g=>!g.ok).map(g=>`<li>${esc(g.t)}</li>`).join("");
    openCard(`<h2>Запуск отменён</h2><p>Комиссия не допускает спутник к полёту.</p>
      ${errs?`<p><b>Исправьте ошибки:</b></p><ul>${errs}</ul>`:""}${gl?`<p><b>Не выполнены задачи миссии:</b></p><ul>${gl}</ul>`:""}
      <button class="launch" type="button" data-close>Вернуться к сборке</button>`);
    return;
  }
  const stars = Array.from({length:30},()=>`<span class="star" style="left:${Math.random()*100}%;top:${Math.random()*60}%"></span>`).join("");
  openCard(`<div class="flight">${stars}<div class="earth"></div><div class="sat"></div></div>
    <h2>Спутник на орбите!</h2><p>Миссия ${MISSIONS[st.mission].t} выполнена. Отделение от ракеты прошло штатно, антенны раскрыты, первый сеанс связи состоялся.</p>
    <div class="kv"><span>Формат</span><span>${st.u}U</span><span>Масса</span><span>${nf(s.mass/1000,2)} кг</span>
    <span>Запас энергии</span><span>${nf((s.gen-s.cons)/Math.max(s.cons,.01)*100)}%</span><span>Модулей в стопке</span><span>${st.stack.length}</span>
    ${s.videoDays!==null?`<span>Минута видео до Земли</span><span>${s.videoDays<1?nf(VIDEO_BYTES*8/s.rate/60,1)+" мин связи":nf(s.videoDays)+" сут"}</span>`:""}</div>
    <button class="launch" type="button" data-close>Собрать следующий</button>`);
});
