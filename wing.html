.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}

.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}

.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}

.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso{--wg-void:#070707;--wg-sky:#3987e5;--wg-strato:#7f63d9;--wg-comp:#e0703a;--wg-exp:#3987e5;--wg-s1:#3987e5;--wg-s2:#d95926;--wg-s3:#199e70;--wg-grid:#2c2c2a;--wg-axis:#383835;--wg-mesh:#6a6a6a}

.wg-band{fill:var(--wg-sky);fill-opacity:var(--o);stroke:none}

[data-part="flow"]{transition:opacity .6s var(--anatomy-ease)}

[data-angle]{transition:opacity .5s var(--anatomy-ease)}

/* что подсвечено на этапе */
.wg-svg[data-stage="1"] [data-part="wing"]>.iso-solid>.iso-edge,.wg-svg[data-stage="3"] [data-part="wing"]>.iso-solid>.iso-edge{stroke:var(--anatomy-lit)}

.iso-page{margin:8px auto 64px}

.wg-chart-body .pt-cx{fill:var(--anatomy-strong)}
.wg-chart-body .min{fill:none;stroke:var(--wg-s1);stroke-width:1.6}
.wg-chart-body .cur{stroke:var(--anatomy-lo);stroke-width:1}
.wg-chart-body .cur-dot{fill:var(--anatomy-card);stroke:var(--anatomy-lit);stroke-width:1.8}
.wg-chart.deg .cur-dot{stroke:var(--wg-s2)}
.wg-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--anatomy-text);margin-top:4px}
.wg-legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--anatomy-strong);vertical-align:middle;margin-right:5px}
.wg-legend i.l-thick{border-top:2px dashed var(--wg-s1)}
.wg-legend i.l-alpha{border-top:2px dotted var(--wg-s2)}
.wg-why{margin:6px 0 0;font-size:11.5px;line-height:1.45;color:var(--anatomy-text)}
.wg-control summary{cursor:pointer;font:10.5px/1.4 var(--anatomy-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--anatomy-muted)}
.wg-ok{text-transform:none;letter-spacing:0;color:var(--wg-s3);margin-left:6px}
.wg-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:11.5px;margin-top:6px}
.wg-table th{font-weight:500;color:var(--anatomy-muted);text-align:right;padding:3px 4px;border-bottom:1px solid var(--anatomy-faint);font-size:10.5px}
.wg-table td{text-align:right;padding:2.5px 4px;border-bottom:1px solid var(--anatomy-faint);color:var(--anatomy-text)}
.wg-table th:first-child,.wg-table td:first-child{text-align:left}
.wg-table tr.on td{color:var(--anatomy-strong);font-weight:600;background:color-mix(in srgb,var(--anatomy-faint) 40%,transparent)}
.wg-src{margin:6px 0 0;font-size:10.5px;line-height:1.4;color:var(--anatomy-muted)}
.wg-note{margin:10px 0 0;text-align:center;color:var(--anatomy-muted);font-size:11.5px}

.wg-callouts{position:absolute;inset:0;pointer-events:none}
.wg-callout{position:absolute;box-sizing:border-box;padding:7px 10px 8px;border:1px solid var(--anatomy-lo);border-radius:6px;background:color-mix(in srgb,var(--anatomy-card) 92%,transparent);color:var(--anatomy-text);font:12px/1.42 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;opacity:0;transform:translateY(4px);transition:opacity .45s var(--anatomy-ease),transform .45s var(--anatomy-ease)}
.wg-callout b{display:block;color:var(--anatomy-strong);font-weight:600;margin-bottom:1px}
.wg-callout.on{opacity:1;transform:none}
.wg-badge{display:none}
.wg-tag{position:absolute;white-space:nowrap;padding:2px 6px;border:1px solid var(--anatomy-faint);border-radius:4px;background:color-mix(in srgb,var(--anatomy-card) 88%,transparent);color:var(--anatomy-text);font:10.5px/1.3 var(--anatomy-mono);letter-spacing:.01em;opacity:0;transition:opacity .45s var(--anatomy-ease)}
.wg-tag.on{opacity:1}
.wg-tag-leader path{stroke:var(--anatomy-lo)}
.wg-tag-leader circle{fill:var(--anatomy-mid)}
.wg-leader{opacity:0;transition:opacity .45s var(--anatomy-ease)}
.wg-leader.on{opacity:1}
.wg-leader path{fill:none;stroke:var(--anatomy-mid);stroke-width:.6px}
.wg-leader circle{fill:var(--anatomy-hi);stroke:var(--anatomy-card);stroke-width:.5px}
@media (prefers-reduced-motion:reduce){.wg-callout,.wg-leader,[data-angle],[data-part="vectors"],[data-part="flow"],.wg-sym,.wg-pop{transition:none}.wg-callout.flash{animation:none}.wg-pin i{transition:none}}

eader" data-tag-leader="5"><path d=""/><circle r="1"/></g><g class="wg-leader wg-tag-leader" data-tag-leader="6"><path d=""/><circle r="1"/></g><g class="wg-leader wg-tag-leader" data-tag-leader="7"><path d=""/><circle r="1"/></g><g class="wg-leader wg-tag-leader" data-tag-leader="8"><path d=""/><circle r="1"/></g><g class="wg-leader wg-tag-leader" data-tag-leader="9"><path d=""/><circle r="1"/></g></g></svg><div class="wg-syms" aria-hidden="true"><span class="wg-sym" data-sym="th1">θ1</span><span class="wg-sym" data-sym="th2">θ2</span><span class="wg-sym" data-sym="al">α</span><span class="wg-sym" data-sym="mu">μ</span><span class="wg-sym" data-sym="flow">V∞</span><span class="wg-sym" data-sym="tmax">t_max</span></div><div class="wg-pops" aria-live="polite"><div class="wg-pop" data-pop="0">0 км: θ = 7,76°, t_max = 13,6 % — профиль толстый и тупой</div><div class="wg-pop" data-pop="10">10 км: θ = 5,56°, t_max = 9,7 %, K = 1,11</div><div class="wg-pop" data-pop="18">18 км: минимум c_x = 0,00912</div><div class="wg-pop" data-pop="20">20 км: θ = 3,76°, t_max = 6,6 % — тонкий и острый, K = 7,38</div></div><div class="wg-callouts" aria-live="polite"><div class="wg-callout" data-callout="0" lang="ru"><span class="wg-badge" aria-hidden="true"></span><b>Профиль — два угла</b><span data-callout-text>θ1 у передней и θ2 у задней кромки; x1 = tg θ2 / (tg θ1 + tg θ2), t_max = 2·x1·tg θ1. Третьей независимой переменной нет — иначе геометрия противоречива. Для ромба с лонжероном на миделе θ1 = θ2.</span></div><div class="wg-callout" data-callout="1" lang="ru"><span class="wg-badge" aria-hidden="true"></span><b>Без прочности задача вырождается</b><span data-callout-text>В линейной теории c_x от толщины и от угла атаки складываются независимо; c_x растёт с t_max, поэтому оптимум — t_max → 0 на любой высоте. Профиль нулевой толщины невозможен: нужна связь с прочностью.</span></div><div class="wg-callout" data-callout="2" lang="ru"><span class="wg-badge" aria-hidden="true"></span><b>Структурная связь</b><span data-callout-text>t_spar,min = 0,06·(q·n / (q_ref·n_ref))^0,25, q_ref = 24 000 Па, n_ref = 1. Чем больше скоростной напор и перегрузка, тем выше лонжерон — и толще профиль.</span></div><div class="wg-callout" data-callout="3" lang="ru"><span class="wg-badge" aria-hidden="true"></span><b>Набор высоты</b><span data-callout-text>c_x растёт с t_max, поэтому t_max = t_spar,min(H), θ_opt = arctg t_spar,min(H). Привод сводит панели: профиль тоньше и острее, α растёт из-за падения q.</span></div><div class="wg-callout" data-callout="4" lang="ru"><span class="wg-badge" aria-hidden="true"></span><b>Проверка в ANSYS Fluent</b><span data-callout-text>Стационарно: 0, 10 и 20 км; density-based, k-ω SST, Roe-FDS, pressure-far-field, сгущение сетки вдоль скачков. Нестационарно — набор высоты: DEFINE_GRID_MOTION (деформируемая сетка), overset для шарнирных панелей, DEFINE_PROFILE для p, T и направления потока по h(t); критерий T_total ≫ τ = c/V (на 2–3 порядка).</span></div><div class="wg-tag" data-tag="0" aria-hidden="true">передняя кромка, шарнир</div><div class="wg-tag" data-tag="1" aria-hidden="true">задняя кромка, шарнир</div><div class="wg-tag" data-tag="2" aria-hidden="true">верхняя панель (две грани)</div><div class="wg-tag" data-tag="3" aria-hidden="true">нижняя панель</div><div class="wg-tag" data-tag="4" aria-hidden="true">шарнир у лонжерона</div><div class="wg-tag" data-tag="5" aria-hidden="true">лонжерон x = 0,5c: привод винт-гайка</div><div class="wg-tag" data-tag="6" aria-hidden="true">БПЛА (M = 3), разрез А–А</div><div class="wg-tag" data-tag="7" aria-hidden="true">траектория набора 0 → 20 км</div><div class="wg-tag" data-tag="8" aria-hidden="true">шкала высоты</div><div class="wg-tag" data-tag="9" aria-hidden="true">тропопауза, 11 км</div></div><div class="wg-pins"><button type="button" class="wg-pin" data-pin-callout="0" aria-label="Выноска: Профиль — два угла"><i></i></button><button type="button" class="wg-pin" data-pin-callout="1" aria-label="Выноска: Без прочности задача вырождается"><i></i></button><button type="button" class="wg-pin" data-pin-callout="2" aria-label="Выноска: Структурная связь"><i></i></button><button type="button" class="wg-pin" data-pin-callout="3" aria-label="Выноска: Набор высоты"><i></i></button><button type="button" class="wg-pin" data-pin-callout="4" aria-label="Выноска: Проверка в ANSYS Fluent"><i></i></button><button type="button" class="wg-pin wg-pin-tag" data-pin-tag="0" aria-label="1: передняя кромка, шарнир"><i>1</i></button><button type="button" class="wg-pin wg-pin-tag" data-pin-tag="1" aria-label="2: задняя кромка, шарнир"><i>2</i></button><button type="button" class="wg-pin wg-pin-tag" data-pin-tag="2" aria-label="3: верхняя панель (две грани)"><i>3</i></button><button type="button" class="wg-pin wg-pin-tag" data-pin-tag="3" aria-label="4: нижняя панель"><i>4</i></button><button type="button" class="wg-pin wg-pin-tag" data-pin-tag="4" aria-label="5: шарнир у лонжерона"><i>5</i></button><button type="button" class="wg-pin wg-pin-tag" data-pin-tag="5" aria-label="6: лонжерон x = 0,5c: привод винт-гайка"><i>6</i></button><button type="button" class="wg-pin wg-pin-tag" data-pin-tag="6" aria-label="7: БПЛА (M = 3), разрез А–А"><i>7</i></button><button type="button" class="wg-pin wg-pin-tag" data-pin-tag="7" aria-label="8: траектория набора 0 → 20 км"><i>8</i></button><button type="button" class="wg-pin wg-pin-tag" data-pin-tag="8" aria-label="9: шкала высоты"><i>9</i></button><button type="button" class="wg-pin wg-pin-tag" data-pin-tag="9" aria-label="10: тропопауза, 11 км"><i>10</i></button></div><span class="wg-sr" role="status" aria-live="polite" data-status></span></div><div class="wg-steps" role="group" aria-label="Этап"><button type="button" data-step="0" aria-pressed="false" aria-label="Этап 1: Постановка"><span>01</span><em>Постановка</em></button><button type="button" data-step="1" aria-pressed="false" aria-label="Этап 2: Ключевая трудность"><span>02</span><em>Ключевая трудность</em></button><button type="button" data-step="2" aria-pressed="false" aria-label="Этап 3: Структурная связь"><span>03</span><em>Структурная связь</em></button><button type="button" data-step="3" aria-pressed="true" aria-label="Этап 4: Набор высоты"><span>04</span><em>Набор высоты</em></button><button type="button" data-step="4" aria-pressed="false" aria-label="Этап 5: Проверка в ANSYS Fluent"><span>05</span><em>Проверка в ANSYS Fluent</em></button></div><p class="wg-stage-name" data-stage-name aria-hidden="true">Этап 4 из 5 · Набор высоты</p><ol class="wg-taglist" data-taglist aria-label="Узлы на рисунке"><li><button type="button" data-tagitem="0"><b>1</b>передняя кромка, шарнир</button></li><li><button type="button" data-tagitem="1"><b>2</b>задняя кромка, шарнир</button></li><li><button type="button" data-tagitem="2"><b>3</b>верхняя панель (две грани)</button></li><li><button type="button" data-tagitem="3"><b>4</b>нижняя панель</button></li><li><button type="button" data-tagitem="4"><b>5</b>шарнир у лонжерона</button></li><li><button type="button" data-tagitem="5"><b>6</b>лонжерон x = 0,5c: привод винт-гайка</button></li><li><button type="button" data-tagitem="6"><b>7</b>БПЛА (M = 3), разрез А–А</button></li><li><button type="button" data-tagitem="7"><b>8</b>траектория набора 0 → 20 км</button></li><li><button type="button" data-tagitem="8"><b>9</b>шкала высоты</button></li><li><button type="button" data-tagitem="9"><b>10</b>тропопауза, 11 км</button></li></ol></div><aside class="wg-side"><section class="wg-player" data-player aria-label="Набор высоты"><div class="wg-ctrl-head"><span>Набор высоты</span></div><div class="wg-prow"><button type="button" class="wg-play" data-play aria-pressed="true" aria-label="Пауза"><span data-play-icon>❚❚</span></button><div class="wg-speed" role="group" aria-label="Скорость воспроизведения"><button type="button" data-speed="1" aria-pressed="false">×1</button><button type="button" data-speed="2" aria-pressed="false">×2</button><button type="button" data-speed="4" aria-pressed="true">×4</button></div></div><label class="wg-slider wg-hslider"><span class="wg-sl-head"><span>Высота H</span><output data-out="H">0,0</output><i>км</i></span><input type="range" min="0" max="20" step="0.1" value="0" data-input="H" aria-label="Высота H, км"><span class="wg-sl-ticks"><span>0</span><span>5</span><span>10</span><span>15</span><span>20</span></span></label></section><section class="wg-ctrl" aria-label="Режим полёта"><div class="wg-ctrl-head"><span>Режим полёта</span><button type="button" class="wg-free" data-free aria-pressed="false">Свободный режим</button></div><div class="wg-freebox" data-freebox><label class="wg-slider" data-slider="M"><span class="wg-sl-head"><span>Число Маха M</span><output data-out="M">3</output></span><input type="range" min="1.5" max="5" step="0.1" value="3" data-input="M" aria-label="Число Маха M"><span class="wg-sl-ticks"><span>1,5</span><span>5</span></span></label><label class="wg-slider" data-slider="n"><span class="wg-sl-head"><span>Перегрузка n</span><output data-out="n">1</output></span><input type="range" min="1" max="4" step="0.1" value="1" data-input="n" aria-label="Перегрузка n"><span class="wg-sl-ticks"><span>1</span><span>4</span></span></label><p class="wg-freenote" data-freenote>M и n зафиксированы: M = 3, n = 1 (контрольный случай). Включите «Свободный режим», чтобы менять их — модель пересчитает всё по тем же формулам.</p></div><table class="wg-spec" data-spec></table></section><section class="wg-chart" data-chart aria-label="Графики по высоте"><div class="wg-chart-title" data-chart-title>Оптимум по высоте</div><div class="wg-chart-body" data-panel="theta"></div><div class="wg-chart-body" data-panel="cx"></div><p class="wg-why" data-why></p></section><details class="wg-control" data-controlbox><summary>Контрольные значения (M = 3, n = 1) <span class="wg-ok" data-ok></span></summary><table class="wg-table"><thead><tr><th>H, км</th><th>θ, °</th><th>t_max, %</th><th>c_y</th><th>c_x</th><th>K</th></tr></thead><tbody><tr data-row="0"><td>0</td><td>7,76</td><td>13,6</td><td>0,0039</td><td>0,02627</td><td>0,15</td></tr><tr data-row="2"><td>2</td><td>7,31</td><td>12,8</td><td>0,0050</td><td>0,02327</td><td>0,21</td></tr><tr data-row="4"><td>4</td><td>6,86</td><td>12,0</td><td>0,0064</td><td>0,02051</td><td>0,31</td></tr><tr data-row="6"><td>6</td><td>6,42</td><td>11,3</td><td>0,0084</td><td>0,01797</td><td>0,47</td></tr><tr data-row="8"><td>8</td><td>5,99</td><td>10,5</td><td>0,0111</td><td>0,01565</td><td>0,71</td></tr><tr data-row="10"><td>10</td><td>5,56</td><td>9,7</td><td>0,0150</td><td>0,01357</td><td>1,11</td></tr><tr data-row="12"><td>12</td><td>5,15</td><td>9,0</td><td>0,0205</td><td>0,01177</td><td>1,74</td></tr><tr data-row="14"><td>14</td><td>4,76</td><td>8,3</td><td>0,0281</td><td>0,01036</td><td>2,72</td></tr><tr data-row="16"><td>16</td><td>4,40</td><td>7,7</td><td>0,0386</td><td>0,00942</td><td>4,10</td></tr><tr data-row="18"><td>18</td><td>4,07</td><td>7,1</td><td>0,0529</td><td>0,00912</td><td>5,80</td></tr><tr data-row="20"><td>20</td><td>3,76</td><td>6,6</td><td>0,0725</td><td>0,00982</td><td>7,38</td></tr></tbody></table><p class="wg-src">Таблица — из отчёта (раздел 4). Строка подсвечивается, когда БПЛА проходит эту высоту при M = 3, n = 1.</p></details></aside></div><p class="wg-note">Линейная теория Аккерета, ГОСТ 4401-81; проверка — ANSYS Fluent</p></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Что меняется: профиль в разрезе (θ, t_max, α), положение БПЛА, пройденная часть траектории</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Разрез А–А: две панели на шарнирах, лонжерон с приводом винт-гайка, поле течения; пунктир — профиль на 0 км</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Полёт: слои атмосферы 0–20 км, тропопауза, шкала высоты, взлётная полоса</span></span><span class="iso-caption">Симметричный ромбовидный профиль, лонжерон на середине хорды (x = 0,5c); профиль задаётся углами θ1 и θ2, x1 и t_max выводятся из них. Атмосфера — ГОСТ 4401-81; q = 0,5·ρ·(M·a)², c_y = n·G/(q·S), G = 1500 Н, S = 0,6 м²; β = √(M² − 1), α = c_y·β/4, c_x = (4/β)·t_max² + (4/β)·α²; t_spar,min = 0,06·(q·n/(q_ref·n_ref))^0,25. Разрез — в натуральную относительную толщину, пунктир — профиль на 0 км; векторы c_y и c_x — в одном масштабе. Картина течения вокруг разреза — та же линейная теория: волны под углом Маха μ = arcsin(1/M), зоны окрашены по C_p = 2δ/β (тёплый — сжатие, холодный — разрежение). БПЛА, траектория и слои атмосферы — схема, не в масштабе; воспроизведение идёт по высоте H, скорость ×1/×2/×4 — темп анимации, а не скорость набора. Аналитика — линейная теория; требует CFD-проверки (НИР БГТУ «ВОЕНМЕХ», госзадание FZWF-2024-0003, п. 3.1, «Пчелка»).</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])

  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {

      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));

  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }

  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;

  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));

    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);

  const m = meridian.length;

  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));

    seen.push(row);
    tones.push(toneRow);

  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));

      const b = run.map((j) => rings[i + 1][j]).reverse();

    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);

    if (ranges.some((range) => !range)) return [];

    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];

    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));

  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;

  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }

  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";

  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];

  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];

    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));

  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));

  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);

  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
