<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лаборатория нагрузок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Russo+One&display=swap">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#14213D; --muted:#586983; --line:#CBD4E1;
  --frame:#1D4E89; --frameSoft:#DCE6F3; --accent:#C58A12; --accentInk:#865A00;
  --ok:#2B8A3E; --okBg:#E6F4EA; --err:#C92A2A; --errBg:#FCE8E8;
  --pad:#3D6A86; --padSoft:#E1ECF3; --spr:#3F7A62; --sprSoft:#E2F0E9;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1626; --surface:#122238; --surface2:#0F1D30; --ink:#E6EDF7; --muted:#95A6C0; --line:#28405F;
    --frame:#7FB2F0; --frameSoft:#16304F; --accent:#E2B04A; --accentInk:#E9BE63;
    --ok:#69DB7C; --okBg:#133322; --err:#FF8787; --errBg:#3D1718;
    --pad:#8FC1DE; --padSoft:#17324A; --spr:#8FD1B3; --sprSoft:#163A2D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1626; --surface:#122238; --surface2:#0F1D30; --ink:#E6EDF7; --muted:#95A6C0; --line:#28405F;
  --frame:#7FB2F0; --frameSoft:#16304F; --accent:#E2B04A; --accentInk:#E9BE63;
  --ok:#69DB7C; --okBg:#133322; --err:#FF8787; --errBg:#3D1718;
  --pad:#8FC1DE; --padSoft:#17324A; --spr:#8FD1B3; --sprSoft:#163A2D;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 32px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:20px 16px;border-bottom:1px solid var(--line)}
.brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:4px 0 0}
.brand h1 span{color:var(--accentInk)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;font-weight:600;text-decoration:none;color:var(--frame);display:inline-flex;align-items:center;gap:8px}
.score-top{font-family:var(--mono);font-weight:600;color:var(--accentInk);font-size:17px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
@media (max-width:760px){.tabs{grid-template-columns:repeat(2,1fr)}}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.tab .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tab .t{font-weight:600;line-height:1.2}
.tab .s{font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--frame);box-shadow:inset 0 0 0 1px var(--frame);background:var(--frameSoft)}
.tab.done .s{color:var(--ok);font-weight:600}

.station{margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 14px;max-width:70ch}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.qn{font-family:var(--mono);font-size:13px;color:var(--muted)}
.question{font-size:clamp(18px,2.4vw,22px);font-weight:600;margin:8px 0 14px;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:12px;text-align:left;font-weight:600;min-height:52px}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.opt:hover:not(:disabled){border-color:var(--frame)}
.opt.right{background:var(--okBg);border-color:var(--ok)}
.opt.wrong{background:var(--errBg);border-color:var(--err)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px}
.fb.ok{background:var(--okBg)} .fb.err{background:var(--errBg)}
.fb b{display:block}
.fb.ok b{color:var(--ok)} .fb.err b{color:var(--err)}
.next{margin-top:12px;border:0;border-radius:10px;background:var(--accent);color:#1B1300;font-weight:600;padding:10px 18px;min-height:44px}
.result{text-align:center;padding:10px 0}
.result .big{font-family:var(--display);font-size:40px;color:var(--accentInk)}

.mods{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.mods{grid-template-columns:1fr}}
.mod{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2)}
.mod h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.mod.pad h3{color:var(--pad)} .mod.spr h3{color:var(--spr)}
.mod .what{margin:4px 0 10px;color:var(--muted);font-size:14px}
.viewer{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#EEF2F7;aspect-ratio:1/1;max-width:100%}
.viewer img{width:100%;height:100%;object-fit:contain;display:block}
.vbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vbtns button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.vbtns button[aria-pressed="true"]{background:var(--frame);color:var(--surface);border-color:var(--frame)}
.facts{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.facts li{display:grid;grid-template-columns:120px 1fr;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.facts li span:first-child{color:var(--muted)}
.facts li span:last-child{font-weight:500}
.sort{margin-top:18px}
.cardq{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface2);text-align:center}
.cardq .item{font-size:20px;font-weight:600;margin:6px 0 14px;text-wrap:balance}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three .opt{text-align:center}
.three .opt.p{color:var(--pad)} .three .opt.s{color:var(--spr)}

.steps{display:flex;flex-direction:column;gap:8px}
.done-seq{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.seq{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;border-radius:10px;padding:8px 10px;background:var(--okBg)}
.seq i{font-style:normal;font-family:var(--mono);font-weight:600;color:var(--ok);text-align:center}
.seq.slot{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.seq.slot i{color:var(--muted)}
.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.bad{animation:none}}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 6px;margin-right:6px;vertical-align:1px}
.tag.p{background:var(--padSoft);color:var(--pad)} .tag.s{background:var(--sprSoft);color:var(--spr)}
.src{font-size:12px;color:var(--muted);margin-top:12px}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>Школа МКА · Космическая мастерская</small>
      <h1>Лаборатория <span>нагрузок</span></h1>
    </div>
    <div class="links">
      <span class="ghost" style="color:var(--ink)">Звёзды: <span class="score-top" id="stars">0</span></span>

      <a class="ghost" href="sborka.html" id="lnk2">Сборочный цех</a>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="station" class="station"></main>
</div>

/* ---------- состояние ---------- */
const ST = {
  sys:{i:0, score:0, order:shuffle(SIT), answered:null, done:false},
  mis:{i:0, score:0, order:shuffle(MIS), opts:[], answered:null, done:false},
  parts:{i:0, score:0, order:shuffle(PARTS), answered:null, done:false, viewPad:"isometric", viewSpr:"isometric"},
  cyc:{done:[], errors:0, order:shuffle(CYCLE.map(c=>c.t)), msg:null, finished:false}
};
const MAX = {sys:SIT.length, mis:MIS.length, parts:PARTS.length, cyc:CYCLE.length};
let cur = "sys";

function stars(){
  const c = ST.cyc.finished ? Math.max(0, CYCLE.length - ST.cyc.errors) : 0;
  return ST.sys.score + ST.mis.score + ST.parts.score + c;
}
const TABS = [
  {id:"sys", k:"Станция 1", t:"Системы спутника"},
  {id:"mis", k:"Станция 2", t:"Подбери нагрузку"},
  {id:"parts", k:"Станция 3", t:"PAD и SPRITE"},
  {id:"cyc", k:"Станция 4", t:"Цикл эксперимента PAD"}
];
function doneOf(id){ return id==="cyc" ? ST.cyc.finished : ST[id].done; }
function progOf(id){
  if(id==="cyc") return ST.cyc.finished ? `готово · ${Math.max(0,CYCLE.length-ST.cyc.errors)} ★` : `${ST.cyc.done.length} из ${CYCLE.length}`;
  const s=ST[id]; return s.done ? `готово · ${s.score} ★` : `${s.i} из ${MAX[id]}`;
}
function renderTabs(){
  $("tabs").innerHTML = TABS.map(t=>`<button class="tab${doneOf(t.id)?" done":""}" role="tab" aria-selected="${cur===t.id}" data-tab="${t.id}"><span class="k">${t.k}</span><span class="t">${t.t}</span><span class="s">${progOf(t.id)}</span></button>`).join("");
  $("stars").textContent = stars();
}

/* ---------- квиз ---------- */
function quiz(key, cfg){
  const s = ST[key];
  if(s.done){
    return `<div class="panel"><div class="result"><div class="big">${s.score} из ${MAX[key]} ★</div><p>${cfg.doneText}</p><button class="next" data-act="restart" data-key="${key}">Пройти ещё раз</button></div></div>`;
  }
  const it = s.order[s.i];
  const opts = cfg.options(it, s);
  let fb = "";
  if(s.answered){
    const ok = s.answered===it.a;
    fb = `<div class="fb ${ok?"ok":"err"}"><b>${ok?"Верно!":"Не совсем. Правильно: "+esc(cfg.label(it.a))}</b>${esc(it.w)}</div><button class="next" data-act="next" data-key="${key}">${s.i+1<MAX[key]?"Дальше":"Итог"}</button>`;
  }
  return `<div class="panel"><div class="qhead"><h2>${cfg.title}</h2><span class="qn">Вопрос ${s.i+1} из ${MAX[key]} · ★ ${s.score}</span></div>
    <p class="lead">${cfg.lead}</p><div class="question">${esc(it.q)}</div>
    <div class="opts">${opts.map(o=>{
      let cls=""; if(s.answered){ if(o.id===it.a) cls=" right"; else if(o.id===s.answered) cls=" wrong"; }
      return `<button class="opt${cls}" data-act="ans" data-key="${key}" data-id="${o.id}" ${s.answered?"disabled":""}>${esc(o.t)}<small>${esc(o.s)}</small></button>`;
    }).join("")}</div>${fb}</div>`;
}
const CFG = {
  sys:{title:"Чья это работа?", lead:"Спутник — это команда систем. Прочитайте, что произошло, и выберите систему, которая за это отвечает.",
    doneText:"Вы знаете, кто за что отвечает на борту. Переходите к станции 2.",
    options:()=>SYS, label:id=>SYS.find(x=>x.id===id).t},
  mis:{title:"Подбери нагрузку к миссии", lead:"Полезная нагрузка — это то, ради чего летит спутник. Выберите подходящую для задачи.",
    doneText:"Нагрузку выбирают под задачу, а не наоборот. Переходите к станции 3.",
    options:(it,s)=>{ if(!s.opts[s.i]){ const others=shuffle(Object.keys(PL).filter(k=>k!==it.a)).slice(0,3); s.opts[s.i]=shuffle([it.a,...others]); } return s.opts[s.i].map(id=>({id, t:PL[id].t, s:PL[id].s})); },
    label:id=>PL[id].t}
};

/* ---------- станция 3 ---------- */
function viewer(mod,cls,state){
  const names={isometric:"Изометрия",front:"Спереди",side:"Сбоку",top:"Сверху"};
  return `<div class="viewer"><img src="${IMG[mod+"_"+state]}" alt="${mod}, вид: ${names[state]}"></div>
    <div class="vbtns">${Object.entries(names).map(([k,v])=>`<button type="button" data-act="view" data-mod="${mod}" data-v="${k}" aria-pressed="${state===k}">${v}</button>`).join("")}</div>`;
}
function partsStation(){
  const s = ST.parts;
  const mods = `<div class="mods">
    <div class="mod pad"><h3>PAD</h3><p class="what">Эксперимент: как слипаются пылинки в невесомости. Камера с ИК-подсветкой снимает частицы внутри модуля.</p>
      ${viewer("PAD","pad",s.viewPad)}
      <ul class="facts"><li><span>Съёмка</span><span>камера MIPI, 4 ИК-светодиода</span></li><li><span>Обработка</span><span>Raspberry Pi CM5, 32 ГБ</span></li><li><span>Запуск опыта</span><span>4 нихромовые нити = 4 цикла</span></li><li><span>Плата</span><span>55 × 70 мм</span></li><li><span>Данные</span><span>видео, сжатие на борту</span></li></ul></div>
    <div class="mod spr"><h3>SPRITE</h3><p class="what">Эксперимент: как разные покрытия отражают свет и нагреваются на орбите.</p>
      ${viewer("SPRITE","spr",s.viewSpr)}
      <ul class="facts"><li><span>Образцы</span><span>6 ячеек с покрытиями</span></li><li><span>Датчики света</span><span>18 фотодиодов: видимый, ИК, широкий</span></li><li><span>Температура</span><span>датчики Pt1000 на образцах</span></li><li><span>Плата</span><span>60 × 70 мм</span></li><li><span>Данные</span><span>числа, запись на microSD</span></li></ul></div>
  </div>`;
  let game;
  if(s.done){
    game = `<div class="cardq"><div class="big" style="font-family:var(--display);font-size:34px;color:var(--accentInk)">${s.score} из ${MAX.parts} ★</div><p>Теперь вы отличите PAD от SPRITE по любой детали.</p><button class="next" data-act="restart" data-key="parts">Пройти ещё раз</button></div>`;
  } else {
    const it = s.order[s.i];
    const lab = {p:"PAD", s:"SPRITE", b:"Оба модуля"};
    let fb="";
    if(s.answered){ const ok=s.answered===it.a; fb=`<div class="fb ${ok?"ok":"err"}" style="text-align:left"><b>${ok?"Верно!":"Правильно: "+lab[it.a]}</b>${esc(it.w)}</div><button class="next" data-act="next" data-key="parts">${s.i+1<MAX.parts?"Дальше":"Итог"}</button>`; }
    game = `<div class="cardq"><div class="qn">Деталь ${s.i+1} из ${MAX.parts} · ★ ${s.score}</div><div class="item">${esc(it.t)}</div>
      <div class="three">${["p","s","b"].map(k=>{ let c=""; if(s.answered){ if(k===it.a) c=" right"; else if(k===s.answered) c=" wrong"; } return `<button class="opt ${k}${c}" data-act="ans" data-key="parts" data-id="${k}" ${s.answered?"disabled":""}>${lab[k]}</button>`; }).join("")}</div>${fb}</div>`;
  }
  return `<div class="panel"><h2>Разбери PAD и SPRITE</h2><p class="lead">Это полезные нагрузки, которые разрабатывают в нашей лаборатории. Переключайте виды 3D-модели, прочитайте характеристики и ответьте: чья это деталь?</p>
    ${mods}<div class="sort"><h2 style="font-size:18px">Чья это деталь?</h2>${game}</div>
    <p class="src">Характеристики взяты из технических заданий на платы модулей.</p></div>`;
}

/* ---------- станция 4 ---------- */
function cycleStation(){
  const c = ST.cyc;
  const seq = CYCLE.map((step,i)=> i<c.done.length ? `<div class="seq"><i>${i+1}</i><span>${esc(step.t)}</span></div>` : `<div class="seq slot"><i>${i+1}</i><span>?</span></div>`).join("");
  const left = c.order.filter(t=>!c.done.includes(t));
  let msg="";
  if(c.msg) msg=`<div class="fb ${c.msg.ok?"ok":"err"}"><b>${c.msg.ok?"Верно":"Пока рано"}</b>${esc(c.msg.t)}</div>`;
  if(c.finished) msg += `<div class="fb ok"><b>Цикл собран. Ошибок: ${c.errors}</b>Четыре нити — четыре таких цикла. Если видео не отправлено, новый цикл не начнётся: сначала нужно освободить память.</div><button class="next" data-act="restart" data-key="cyc">Собрать ещё раз</button>`;
  return `<div class="panel"><h2>Цикл эксперимента PAD</h2><p class="lead">PAD проводит опыт сам, без людей. Расставьте шаги одного цикла по порядку: нажимайте их в правильной последовательности.</p>
    <div class="done-seq">${seq}</div>${msg}
    <div class="steps" style="margin-top:12px">${left.map(t=>`<button class="opt" data-act="cyc" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>`;
}

/* ---------- отрисовка и события ---------- */
function render(){
  renderTabs();
  let html;
  if(cur==="sys") html=quiz("sys",CFG.sys);
  else if(cur==="mis") html=quiz("mis",CFG.mis);
  else if(cur==="parts") html=partsStation();
  else html=cycleStation();
  $("station").innerHTML = html;
}
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]"); if(tb){ cur=tb.dataset.tab; render(); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, key=b.dataset.key;
  if(act==="ans"){ const s=ST[key]; if(s.answered) return; s.answered=b.dataset.id; if(s.answered===s.order[s.i].a) s.score++; render(); }
  else if(act==="next"){ const s=ST[key]; s.answered=null; s.i++; if(s.i>=MAX[key]) s.done=true; render(); }
  else if(act==="restart"){
    if(key==="cyc") ST.cyc={done:[],errors:0,order:shuffle(CYCLE.map(c=>c.t)),msg:null,finished:false};
    else { const src={sys:SIT,mis:MIS,parts:PARTS}[key]; Object.assign(ST[key],{i:0,score:0,order:shuffle(src),answered:null,done:false,opts:[]}); }
    render();
  }
  else if(act==="view"){ if(b.dataset.mod==="PAD") ST.parts.viewPad=b.dataset.v; else ST.parts.viewSpr=b.dataset.v; render(); }
  else if(act==="cyc"){
    const c=ST.cyc, t=b.dataset.t, need=CYCLE[c.done.length];
    if(t===need.t){ c.done.push(t); c.msg={ok:true,t:need.w}; if(c.done.length===CYCLE.length) c.finished=true; render(); }
    else { c.errors++; c.msg={ok:false,t:WRONG_CYCLE[t]||"Этот шаг будет позже."}; render(); const x=document.querySelector(`[data-t="${CSS.escape(t)}"]`); if(x) x.classList.add("bad"); }
  }
});
render();
})();
</script>

</html>
